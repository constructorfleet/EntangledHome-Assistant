[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entangledhome-assistant"
version = "0.5.0"
description = "Home Assistant custom component placeholder project"
requires-python = ">=3.13,<3.14"
license = { text = "BSL-1.1" }
dependencies = [
    "homeassistant",
    "httpx",
    "pydantic",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[dependency-groups]
dev = [
    "coverage[toml]",
    "pluggy",
    "pytest",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "ruff",
    "fastapi",
    "uvicorn[standard]",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
