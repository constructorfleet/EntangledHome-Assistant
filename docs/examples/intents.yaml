# Reference mapping for the options flow Intent routing configuration field.
# Paste an adapted JSON version of this mapping into the options flow; configuration.yaml does not read this file directly.

entangledhome:
  intents_config:
    entangledhome.turn_on:
      # Provide optional slot hints that the adapter can promote to users.
      enabled: true
      slots:
        color:
          - warm
          - cool white
          - daylight
      threshold: 0.7
    entangledhome.open_garage:
      # Keep the adapter hint lightweight and configure the actual guardrails via the options UI.
      enabled: true
      threshold: 0.9
      slots:
        area:
          - garage
      # Guardrail options such as dangerous_intents, intent_thresholds, intent_allowed_hours,
      # intent_recent_command_windows, and intent_secondary_signals live under the integration's
      # options flow. List this intent in the Dangerous intents field and add secondary-signal
      # requirements or after-hours blocks there.
    entangledhome.scene_activate:
      # Disable an intent without deleting it from the mapping.
      enabled: false
      slots:
        scene:
          - movie time
          - relax mode
      threshold: 0.6
