name: release
permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run test suite
        run: pytest

      - name: Determine release metadata
        id: versioning
        run: |
          python scripts/versioning.py ensure-new --pyproject pyproject.toml --github-output version_info.txt
          cat version_info.txt >> "$GITHUB_OUTPUT"

      - name: Create tag
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.versioning.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            if (!tag) {
              core.setFailed('Tag value missing');
              return;
            }
            const ref = `refs/tags/${tag}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              sha: context.sha,
            });

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          generate_release_notes: true
          body: |
            Refer to docs/releases/${{ steps.versioning.outputs.tag }}.md for curated highlights and migration guidance.
